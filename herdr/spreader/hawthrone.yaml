# One workspace, apply with: herdr-spreader apply -f ~/.config/herdr-spreader/hawthrone.yaml
workspaces:
  - name: Hawthrone
    root: "/home/sukuna/projects/AU/hawthorne-au"
    tabs:
      - label: claude
        panes:
          - command: claude --dangerously-skip-permissions -c
      - label: nvim
        panes:
          - command: nvim .
      - label: terminal
        panes:
          - {}
      - label: server
        panes:
          - command: cd hawthorne-backend
          - split: right
            ratio: 0.5
            command: cd hawthorne-fe
