onboarding = false
[ui]
# WSL defaults to "auto" = herdr draws its own block cursor, which swallows
# nvim's DECSCUSR bar in insert mode. "native" = outer terminal cursor.
host_cursor = "native"
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

[experimental]
pane_history = false
switch_ascii_input_source_in_prefix = false

[ui.toast]
delivery = "system"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[ui.sound]
enabled = false
